[project]
name = "datawarden"
version = "0.1.0"
description = "DataWarden: multi-agent data quality incident investigation and verified recovery (synthetic demo)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "dbt-core>=1.12.5",
    "dbt-postgres>=1.11.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "openai>=3.20.0",
    "opentelemetry-api>=1.45.0",
    "opentelemetry-sdk>=1.45.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2",
    "sse-starlette>=3.5.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datawarden"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.9",
]

[project.scripts]
dw = "datawarden.cli:main"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]
ignore = ["S101", "S603", "S607", "S608", "S311", "B008", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 900
markers = ["integration: needs PostgreSQL", "slow: long-running scenario"]
