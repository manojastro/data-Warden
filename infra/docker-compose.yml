# DataWarden local stack.
#   core:           app-db, warehouse, migrate, api (+ dashboard), worker (pipeline runner)
#   full:           core + Airflow (scheduled runs, failure callbacks)
#   observability:  core + OpenTelemetry collector (debug exporter)
# Secrets come from ../.env (generated by `make setup`); nothing secret is baked into images.
name: datawarden

x-app: &app
  image: datawarden-app:local
  build: { context: .., dockerfile: infra/Dockerfile, secrets: [extra_ca] }
  env_file: ../.env
  environment: &app-env
    DW_APP_DB_HOST: app-db
    DW_APP_DB_PORT: "5432"
    DW_WH_HOST: warehouse
    DW_WH_PORT: "5432"
    DW_ARTIFACT_DIR: /artifacts
    DW_API_BASE_URL: http://api:8000
    DW_CORS_ORIGINS: http://localhost:8000,http://localhost:5173
    DW_AIRFLOW_BASE_URL: ${DW_AIRFLOW_BASE_URL:-}
  volumes: [artifacts:/artifacts]
  restart: unless-stopped

services:
  app-db:
    image: postgres:16-alpine
    profiles: [core, full, observability]
    environment:
      POSTGRES_PASSWORD: ${DW_PG_ADMIN_PASSWORD:?run make setup}
    volumes:
      - app-db:/var/lib/postgresql/data
      - ./postgres/init-airflow.sql:/docker-entrypoint-initdb.d/10-airflow.sql:ro
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 20 }
    restart: unless-stopped

  warehouse:
    image: postgres:16-alpine
    profiles: [core, full, observability]
    environment:
      POSTGRES_PASSWORD: ${DW_PG_ADMIN_PASSWORD:?run make setup}
    volumes: [warehouse:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 20 }
    restart: unless-stopped

  artifacts-init:
    image: postgres:16-alpine
    profiles: [core, full, observability]
    command: ["sh", "-c", "chown -R 1000:0 /artifacts && chmod -R g+rwX /artifacts"]
    volumes: [artifacts:/artifacts]
    restart: "no"

  migrate:
    <<: *app
    profiles: [core, full, observability]
    command: ["sh", "-c", "dw setup-db && alembic upgrade head"]
    depends_on:
      app-db: { condition: service_healthy }
      warehouse: { condition: service_healthy }
      artifacts-init: { condition: service_completed_successfully }
    restart: "no"

  api:
    <<: *app
    profiles: [core, full, observability]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *app
    profiles: [core, full, observability]
    command: ["dw", "worker"]
    healthcheck: { test: ["CMD", "python", "-c", "import datawarden"], interval: 30s }
    depends_on:
      migrate: { condition: service_completed_successfully }

  airflow:
    image: datawarden-airflow:local
    build: { context: .., dockerfile: infra/airflow/Dockerfile, secrets: [extra_ca] }
    profiles: [full]
    command: ["bash", "/opt/start.sh"]
    user: "1000:0"
    env_file: ../.env
    environment:
      <<: *app-env
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:${DW_PG_ADMIN_PASSWORD}@app-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${DW_AIRFLOW_USERNAME:-datawarden}:admin"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /artifacts/airflow/passwords.json
      AIRFLOW__API__BASE_URL: http://localhost:8080
      DW_AIRFLOW_PASSWORD: ${DW_AIRFLOW_PASSWORD:-}
    ports: ["127.0.0.1:8080:8080"]
    volumes: [artifacts:/artifacts, ./airflow/start.sh:/opt/start.sh:ro]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck: { test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v2/monitor/health"], interval: 20s, retries: 30 }
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector:0.136.0
    profiles: [observability]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: [./otel-collector.yaml:/etc/otelcol/config.yaml:ro]
    ports: ["127.0.0.1:4318:4318"]

secrets:
  # Only needed behind a TLS-intercepting proxy: DW_BUILD_EXTRA_CA=/path/to/ca.pem make up
  extra_ca:
    file: ${DW_BUILD_EXTRA_CA:-/dev/null}

volumes:
  app-db: {}
  warehouse: {}
  artifacts: {}
