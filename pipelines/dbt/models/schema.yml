version: 2

models:
  - name: stg_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
  - name: stg_payments
    description: One row per payment event received from the source.
    columns:
      - name: payment_event_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ["captured", "failed", "pending"]
  - name: stg_refunds
    columns:
      - name: refund_event_id
        data_tests: [unique, not_null]
  - name: dim_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
  - name: fct_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
  - name: fct_payments
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
              config:
                severity: warn
  - name: fct_refunds
    columns:
      - name: refund_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ["succeeded", "failed"]
  - name: mart_daily_revenue
    columns:
      - name: business_date
        data_tests: [unique, not_null]
